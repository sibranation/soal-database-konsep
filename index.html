<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis Konsep Basis Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --text: #18181b; --muted: #71717a;
    --line: #e7e5e4; --accent: #4f46e5; --accent-soft: #eef2ff; --ring: rgba(79,70,229,.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 560px; }
  .view { animation: enter .5s cubic-bezier(.2,.8,.2,1) both; }
  .view.leave { animation: leave .25s ease-in both; }
  @keyframes enter { from { opacity: 0; transform: translateY(16px); } }
  @keyframes leave { to { opacity: 0; transform: translateY(-12px); } }
  [hidden] { display: none !important; }

  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
  h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.1; letter-spacing: -.03em; margin: 0 0 12px; font-weight: 700; }
  .lead { color: var(--muted); margin: 0 0 36px; line-height: 1.6; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .field input {
    width: 100%; padding: 14px 16px; font: inherit; font-size: 16px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-weight: 600; font-size: 15px; padding: 14px 22px; border-radius: 12px;
    border: 1px solid transparent; cursor: pointer; transition: transform .15s, opacity .2s, background .2s;
  }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring); }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-primary:disabled { opacity: .3; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .btn-ghost:hover:not(:disabled) { color: var(--text); }
  .btn-ghost:disabled { opacity: 0; pointer-events: none; }
  .btn-block { width: 100%; margin-top: 8px; }
  .btn .arrow { transition: transform .2s; }
  .btn:hover:not(:disabled) .arrow { transform: translateX(3px); }

  .top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .top b { color: var(--text); font-weight: 600; }
  .progress { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 40px; }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }

  .q { animation: enter .4s cubic-bezier(.2,.8,.2,1) both; }
  .q.back { animation-name: enterBack; }
  @keyframes enterBack { from { opacity: 0; transform: translateY(-16px); } }
  .q h2 { font-size: 21px; line-height: 1.45; font-weight: 600; letter-spacing: -.01em; margin: 0 0 24px; }
  .opts { display: grid; gap: 10px; border: 0; padding: 0; margin: 0 0 32px; }
  .opt {
    display: flex; align-items: flex-start; gap: 14px; padding: 16px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    transition: border-color .2s, background .2s, transform .2s;
    animation: enter .4s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 50ms + 80ms);
    line-height: 1.5;
  }
  .opt:hover { border-color: var(--muted); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .key {
    flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    font-size: 13px; font-weight: 600; color: var(--muted); border: 1px solid var(--line);
    transition: all .2s;
  }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:has(input:checked) .key { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.08); }
  .opt:has(input:focus-visible) { box-shadow: 0 0 0 4px var(--ring); }

  .nav { display: flex; justify-content: space-between; gap: 12px; }
  .dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 36px; }
  .dots button {
    width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--line); transition: background .2s, transform .2s;
  }
  .dots button.done { background: var(--muted); }
  .dots button.now { background: var(--accent); transform: scale(1.4); }

  .result { text-align: center; }
  .ring { position: relative; width: 200px; height: 200px; margin: 8px auto 28px; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1); }
  .ring .num { position: absolute; inset: 0; display: grid; place-content: center; }
  .ring .num b { font-size: 56px; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
  .ring .num small { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .who { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .meta { color: var(--muted); margin: 0 0 8px; }
  .msg { color: var(--muted); margin: 0 0 32px; }
  .error { color: #dc2626; font-size: 14px; min-height: 20px; margin: 12px 0 0; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; animation-delay: 0ms !important; }
  }
</style>
</head>
<body>
<main>
  <section id="awal" class="view">
    <p class="eyebrow">Konsep Basis Data</p>
    <h1>Kuis Pilihan Ganda</h1>
    <p class="lead">20 soal tentang model data, model relasional, berorientasi objek, dan SQL. Isi identitas dulu untuk mulai.</p>
    <form id="identitas">
      <div class="field">
        <label for="nama">Nama lengkap</label>
        <input type="text" id="nama" required autocomplete="name" placeholder="Nama kamu">
      </div>
      <div class="field">
        <label for="nim">NIM</label>
        <input type="text" id="nim" required inputmode="numeric" placeholder="Nomor induk mahasiswa">
      </div>
      <button type="submit" id="mulai" class="btn btn-primary btn-block" disabled>Mulai <span class="arrow">→</span></button>
    </form>
  </section>

  <section id="kuis" class="view" hidden>
    <div class="top"><span>Soal <b id="nomor">1</b> / <span id="total">20</span></span><span id="terjawab">0 terjawab</span></div>
    <div class="progress"><span id="bar"></span></div>
    <div id="soal"></div>
    <div class="nav">
      <button type="button" id="prev" class="btn btn-ghost">← Sebelumnya</button>
      <button type="button" id="next" class="btn btn-primary" disabled>Lanjut <span class="arrow">→</span></button>
    </div>
    <p class="error" id="error" role="alert"></p>
    <nav class="dots" id="dots" aria-label="Navigasi soal"></nav>
  </section>

  <section id="hasil" class="view result" hidden>
    <p class="eyebrow">Hasil</p>
    <div class="ring">
      <svg width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="88"/>
        <circle class="bar" id="arc" cx="100" cy="100" r="88" stroke-dasharray="552.9" stroke-dashoffset="552.9"/>
      </svg>
      <div class="num"><b id="skor">0</b><small>dari 100</small></div>
    </div>
    <p class="who" id="who"></p>
    <p class="meta" id="meta"></p>
    <p class="msg" id="msg"></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const nama = $('nama'), nim = $('nim');
let soal = [], jawaban = {}, idx = 0;

const swap = (from, to) => new Promise(done => {
  from.classList.add('leave');
  setTimeout(() => { from.hidden = true; from.classList.remove('leave'); to.hidden = false; window.scrollTo(0, 0); done(); }, 250);
});

const cek = () => { $('mulai').disabled = !(nama.value.trim() && nim.value.trim()); };
nama.addEventListener('input', cek);
nim.addEventListener('input', cek);

$('identitas').addEventListener('submit', async e => {
  e.preventDefault();
  $('mulai').disabled = true;
  try {
    soal = await (await fetch('/api/soal')).json();
  } catch {
    $('mulai').disabled = false;
    return alert('Gagal memuat soal, coba lagi.');
  }
  $('total').textContent = soal.length;
  $('dots').innerHTML = soal.map((_, i) => `<button type="button" aria-label="Soal ${i + 1}" data-i="${i}"></button>`).join('');
  render(0);
  swap($('awal'), $('kuis'));
});

function render(i, back = false) {
  idx = i;
  const s = soal[i];
  const wrap = document.createElement('div');
  wrap.className = 'q' + (back ? ' back' : '');
  const h = document.createElement('h2');
  h.id = 'qt';
  h.textContent = s.pertanyaan;
  const opts = document.createElement('fieldset');
  opts.className = 'opts';
  opts.setAttribute('aria-labelledby', 'qt');
  s.pilihan.forEach((p, j) => {
    const label = document.createElement('label');
    label.className = 'opt';
    label.style.setProperty('--i', j);
    const input = Object.assign(document.createElement('input'), { type: 'radio', name: 'q', value: j, checked: jawaban[s.id] === j });
    input.addEventListener('change', () => { jawaban[s.id] = j; update(); });
    const key = Object.assign(document.createElement('span'), { className: 'key', textContent: 'ABCD'[j] });
    const text = Object.assign(document.createElement('span'), { textContent: p });
    label.append(input, key, text);
    opts.appendChild(label);
  });
  wrap.append(h, opts);
  $('soal').replaceChildren(wrap);
  update();
}

function update() {
  const n = Object.keys(jawaban).length;
  const last = idx === soal.length - 1;
  $('nomor').textContent = idx + 1;
  $('terjawab').textContent = `${n} terjawab`;
  $('bar').style.width = `${(n / soal.length) * 100}%`;
  $('prev').disabled = idx === 0;
  $('next').disabled = jawaban[soal[idx].id] === undefined;
  $('next').innerHTML = last ? 'Selesai <span class="arrow">✓</span>' : 'Lanjut <span class="arrow">→</span>';
  $('error').textContent = '';
  [...$('dots').children].forEach((d, i) => {
    d.className = i === idx ? 'now' : jawaban[soal[i].id] !== undefined ? 'done' : '';
  });
}

$('prev').addEventListener('click', () => idx > 0 && render(idx - 1, true));
$('dots').addEventListener('click', e => {
  const i = Number(e.target.dataset.i);
  if (!Number.isNaN(i) && i !== idx) render(i, i < idx);
});
$('next').addEventListener('click', () => {
  if (idx < soal.length - 1) return render(idx + 1);
  const kosong = soal.findIndex(s => jawaban[s.id] === undefined);
  if (kosong !== -1) {
    render(kosong, true);
    $('error').textContent = `Soal ${kosong + 1} belum dijawab.`;
    return;
  }
  kirim();
});

async function kirim() {
  $('next').disabled = true;
  let h, res;
  try {
    res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nama: nama.value, nim: nim.value, jawaban })
    });
    h = await res.json();
  } catch {}
  if (!res || !res.ok) {
    $('next').disabled = false;
    $('error').textContent = (h && h.error) || 'Gagal mengirim jawaban, coba lagi.';
    return;
  }
  $('who').textContent = h.nama;
  $('meta').textContent = `NIM ${h.nim} · ${h.benar} dari ${h.total} benar`;
  $('msg').textContent = h.skor >= 80 ? 'Luar biasa, pemahamanmu sangat baik.' : h.skor >= 60 ? 'Bagus, tinggal sedikit lagi.' : 'Yuk pelajari lagi materinya.';
  await swap($('kuis'), $('hasil'));
  requestAnimationFrame(() => { $('arc').style.strokeDashoffset = 552.9 * (1 - h.skor / 100); });
  const start = performance.now();
  const tick = t => {
    const p = Math.min((t - start) / 1400, 1);
    $('skor').textContent = Math.round(h.skor * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

document.addEventListener('keydown', e => {
  if ($('kuis').hidden || e.target.matches('input[type=text]')) return;
  const k = 'abcd'.indexOf(e.key.toLowerCase());
  if (k !== -1) { const r = document.querySelectorAll('.opt input')[k]; if (r) { r.checked = true; r.dispatchEvent(new Event('change')); } }
  if (e.key === 'Enter' && !$('next').disabled) $('next').click();
});
</script>
</body>
</html>
